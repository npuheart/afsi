<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>closed_NY45 PyVista examples</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #fafafa; color: #222; }
    h1 { margin-bottom: 0.2rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1rem; }
    figure { margin: 0; background: white; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; }
    img { max-width: 100%; height: auto; display: block; }
    figcaption { margin-top: 0.5rem; font-size: 0.9rem; color: #444; }
  </style>
</head>
<body>
  <h1>closed_NY45 — PyVista 示例图</h1>
  <p class="meta">数据: velocity.xdmf + pressure.xdmf, t = 0.4 s, 2-D 四边形网格 (4692 nodes / 4545 cells)</p>
  <figure>
    <img src="00_overview.png" alt="overview">
    <figcaption>00_overview.png — 总览: |u|、p、速度矢量、流线</figcaption>
  </figure>
  <div class="grid">
    <figure><img src="01_velocity_magnitude.png" alt="velocity magnitude"><figcaption>01_velocity_magnitude.png</figcaption></figure>
    <figure><img src="02_pressure.png" alt="pressure"><figcaption>02_pressure.png</figcaption></figure>
    <figure><img src="03_velocity_vectors.png" alt="velocity vectors"><figcaption>03_velocity_vectors.png</figcaption></figure>
    <figure><img src="04_streamlines.png" alt="streamlines"><figcaption>04_streamlines.png</figcaption></figure>
    <figure><img src="05_cross_section_x.png" alt="cross section"><figcaption>05_cross_section_x.png</figcaption></figure>
  </div>
  <p>生成脚本: <code>make_examples.py</code></p>
</body>
</html>
